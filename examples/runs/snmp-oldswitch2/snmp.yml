auths:
  public_v2:
    community: oldswitch
    security_level: noAuthNoPriv
    auth_protocol: MD5
    priv_protocol: DES
    version: 2
modules:
  if_mib:
    walk:
    - 1.3.6.1.2.1.2.1
    - 1.3.6.1.2.1.2.2.1.2
    - 1.3.6.1.2.1.2.2.1.5
    - 1.3.6.1.2.1.2.2.1.7
    - 1.3.6.1.2.1.2.2.1.8
    - 1.3.6.1.2.1.2.2.1.9
    - 1.3.6.1.2.1.2.2.1.10
    - 1.3.6.1.2.1.2.2.1.14
    - 1.3.6.1.2.1.2.2.1.16
    - 1.3.6.1.2.1.2.2.1.20
    metrics:
    - name: network_interface_count
      oid: 1.3.6.1.2.1.2.1
      type: gauge
      help: Number of network interfaces present on the system. - ifNumber (1.3.6.1.2.1.2.1)
    - name: network_interface_admin_status
      oid: 1.3.6.1.2.1.2.2.1.7
      type: gauge
      help: Desired interface state (1=up, 2=down, 3=testing). - ifAdminStatus (1.3.6.1.2.1.2.2.1.7)
      indexes:
      - labelname: ifIndex
        type: gauge
      lookups:
      - labels:
        - ifIndex
        labelname: interface
        oid: 1.3.6.1.2.1.2.2.1.2
        type: DisplayString
      enum_values:
        1: up
        2: down
        3: testing
    - name: network_interface_oper_status
      oid: 1.3.6.1.2.1.2.2.1.8
      type: gauge
      help: Current operational state (1=up, 2=down, 3=testing, 4=unknown, 5=dormant, 6=notPresent, 7=lowerLayerDown). - ifOperStatus (1.3.6.1.2.1.2.2.1.8)
      indexes:
      - labelname: ifIndex
        type: gauge
      lookups:
      - labels:
        - ifIndex
        labelname: interface
        oid: 1.3.6.1.2.1.2.2.1.2
        type: DisplayString
      enum_values:
        1: up
        2: down
        3: testing
        4: unknown
        5: dormant
        6: notPresent
        7: lowerLayerDown
    - name: network_interface_last_change_seconds
      oid: 1.3.6.1.2.1.2.2.1.9
      type: gauge
      help: sysUpTime value (in timeticks) when the interface entered its current operational state. - ifLastChange (1.3.6.1.2.1.2.2.1.9)
      scale: 0.01
      indexes:
      - labelname: ifIndex
        type: gauge
      lookups:
      - labels:
        - ifIndex
        labelname: interface
        oid: 1.3.6.1.2.1.2.2.1.2
        type: DisplayString
    - name: network_interface_speed_bits
      oid: 1.3.6.1.2.1.2.2.1.5
      type: gauge
      help: Estimate of the interface's current bandwidth in bits per second (32-bit ifTable object; ifHighSpeed is not implemented on this device). - ifSpeed (1.3.6.1.2.1.2.2.1.5)
      indexes:
      - labelname: ifIndex
        type: gauge
      lookups:
      - labels:
        - ifIndex
        labelname: interface
        oid: 1.3.6.1.2.1.2.2.1.2
        type: DisplayString
    - name: network_interface_receive_bytes_total
      oid: 1.3.6.1.2.1.2.2.1.10
      type: counter
      help: Total octets received on the interface (32-bit counter; ifHCInOctets is not implemented on this device). - ifInOctets (1.3.6.1.2.1.2.2.1.10)
      indexes:
      - labelname: ifIndex
        type: gauge
      lookups:
      - labels:
        - ifIndex
        labelname: interface
        oid: 1.3.6.1.2.1.2.2.1.2
        type: DisplayString
    - name: network_interface_transmit_bytes_total
      oid: 1.3.6.1.2.1.2.2.1.16
      type: counter
      help: Total octets transmitted out of the interface (32-bit counter; ifHCOutOctets is not implemented on this device). - ifOutOctets (1.3.6.1.2.1.2.2.1.16)
      indexes:
      - labelname: ifIndex
        type: gauge
      lookups:
      - labels:
        - ifIndex
        labelname: interface
        oid: 1.3.6.1.2.1.2.2.1.2
        type: DisplayString
    - name: network_interface_receive_errors_total
      oid: 1.3.6.1.2.1.2.2.1.14
      type: counter
      help: Inbound packets that contained errors preventing delivery to a higher layer. - ifInErrors (1.3.6.1.2.1.2.2.1.14)
      indexes:
      - labelname: ifIndex
        type: gauge
      lookups:
      - labels:
        - ifIndex
        labelname: interface
        oid: 1.3.6.1.2.1.2.2.1.2
        type: DisplayString
    - name: network_interface_transmit_errors_total
      oid: 1.3.6.1.2.1.2.2.1.20
      type: counter
      help: Outbound packets that could not be transmitted because of errors. - ifOutErrors (1.3.6.1.2.1.2.2.1.20)
      indexes:
      - labelname: ifIndex
        type: gauge
      lookups:
      - labels:
        - ifIndex
        labelname: interface
        oid: 1.3.6.1.2.1.2.2.1.2
        type: DisplayString
